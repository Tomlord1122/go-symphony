version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: go-symphony
    binary: go-symphony
    main: ./
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Tomlord1122/go-symphony/cmd.GoSymphonyVersion={{.Version}}

release:
  prerelease: auto

universal_binaries:
  - id: go-symphony
    replace: true

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
